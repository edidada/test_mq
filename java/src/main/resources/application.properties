# RocketMQ 连接配置
rocketmq.namesrv.addr=127.0.0.1:9876
rocketmq.producer.group=test_producer_group
rocketmq.consumer.group=test_consumer_group

# 主题配置
rocketmq.topic.name=TestTopic
rocketmq.topic.tags=TagA

# 生产者配置
producer.message.count=1000
producer.batch.print.every=100
producer.message.prefix=Hello RocketMQ

# 消费者配置
consumer.print.every=50
consumer.process.delay.ms=10

# 日志配置
log.path=logs
log.level=INFO
log.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# 应用配置
app.name=RocketMQ Demo
app.version=1.0.0
