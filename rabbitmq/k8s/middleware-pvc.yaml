apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: middleware
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: mq-resilience
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
