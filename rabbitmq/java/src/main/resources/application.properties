# RabbitMQ 连接配置
rabbitmq.host=localhost
rabbitmq.port=5672
# guest/guest is only suitable for this local WSL demonstration. Production
# credentials must be injected through deployment configuration.
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.vhost=/

# 队列配置
rabbitmq.queue.name=test_queue
rabbitmq.queue.durable=true
rabbitmq.queue.exclusive=false
rabbitmq.queue.autoDelete=false

# 生产者配置
producer.batch.size=10
producer.batch.critical.every=3
producer.message.prefix=msg

# 消费者配置
consumer.prefetch.count=1
consumer.expected.messages=10
consumer.auto.ack=false

# 日志配置
log.path=logs
log.level=INFO
log.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# 应用配置
app.name=RabbitMQ Resilience Demo
app.version=1.0.0
