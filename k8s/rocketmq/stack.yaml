apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
  namespace: rocketmq-resilience-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-namesrv
  template:
    metadata:
      labels:
        app: rocketmq-namesrv
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:4.9.7
          args: ["sh", "mqnamesrv"]
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms256m -Xmx256m -Xmn128m"
          ports:
            - containerPort: 9876
              name: namesrv
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: namesrv
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-namesrv
  namespace: rocketmq-resilience-test
spec:
  selector:
    app: rocketmq-namesrv
  ports:
    - name: namesrv
      port: 9876
      targetPort: namesrv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-broker
  namespace: rocketmq-resilience-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-broker
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      containers:
        - name: broker
          image: apache/rocketmq:4.9.7
          args: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876"]
          env:
            - name: JAVA_OPT_EXT
              value: "-Xms256m -Xmx256m -Xmn128m"
          ports:
            - containerPort: 10911
              name: remoting
            - containerPort: 10909
              name: fast-remoting
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: remoting
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
  namespace: rocketmq-resilience-test
spec:
  selector:
    app: rocketmq-broker
  ports:
    - name: remoting
      port: 10911
      targetPort: remoting
    - name: fast-remoting
      port: 10909
      targetPort: fast-remoting
