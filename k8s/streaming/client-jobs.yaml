apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-e2e
  namespace: streaming-mq-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker4
      restartPolicy: Never
      containers:
        - name: kafka-client
          image: docker.m.daocloud.io/apache/kafka:3.9.2
          command: ["/bin/bash", "-ec"]
          args:
            - |
              topic=k3s-kafka-e2e
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.middleware.svc.cluster.local:9092 --create --if-not-exists --topic "$topic" --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server kafka.middleware.svc.cluster.local:9092 --topic "$topic" --from-beginning --max-messages 10 --timeout-ms 60000 > /tmp/received &
              consumer_pid=$!
              sleep 3
              seq 1 10 | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka.middleware.svc.cluster.local:9092 --topic "$topic"
              wait "$consumer_pid"
              test "$(wc -l < /tmp/received | tr -d ' ')" -eq 10
              echo "Kafka verification passed: 10 messages produced and consumed"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
