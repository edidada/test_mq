apiVersion: apps/v1
kind: Deployment
metadata:
  name: automq-minio
  namespace: middleware
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automq-minio
  template:
    metadata:
      labels:
        app: automq-minio
    spec:
      containers:
        - name: minio
          image: docker.1panel.live/minio/minio:RELEASE.2025-05-24T17-08-30Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: automq-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: automq-minio
  namespace: middleware
spec:
  selector:
    app: automq-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
