apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: middleware
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pulsar
  template:
    metadata:
      labels:
        app: pulsar
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker2
      containers:
        - name: pulsar
          image: docker.m.daocloud.io/apachepulsar/pulsar:3.3.9
          command: ["/bin/bash", "-ec"]
          args:
            - |
              exec bin/pulsar standalone --advertised-address pulsar.middleware.svc.cluster.local \
                --bookkeeper-port 3181 --no-functions-worker
          env:
            - name: PULSAR_MEM
              value: "-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=512m"
            # Pulsar 3.3 standalone preserves this fixed BookKeeper endpoint across restarts.
            - name: PULSAR_STANDALONE_USE_ZOOKEEPER
              value: "true"
          ports:
            - name: binary
              containerPort: 6650
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: binary
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /pulsar/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pulsar-data
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar
  namespace: middleware
spec:
  # Standalone initializes its default namespace through its own Service before readiness.
  publishNotReadyAddresses: true
  selector:
    app: pulsar
  ports:
    - name: binary
      port: 6650
      targetPort: binary
    - name: http
      port: 8080
      targetPort: http
