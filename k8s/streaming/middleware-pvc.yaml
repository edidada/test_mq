apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: middleware
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: streaming-mq
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
