apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-kraft-config
  namespace: middleware
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@kafka.middleware.svc.cluster.local:9093
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://kafka.middleware.svc.cluster.local:9092
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    controller.listener.names=CONTROLLER
    log.dirs=/var/lib/kafka/data
    num.partitions=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    group.initial.rebalance.delay.ms=0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: middleware
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker4
      containers:
        - name: kafka
          image: docker.m.daocloud.io/apache/kafka:3.9.2
          command: ["/bin/bash", "-ec"]
          args:
            - |
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted \
                --cluster-id 5L6g3g0mTUKsZxO6rB8ZrA \
                --config /opt/kafka/config/custom/server.properties
              exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/custom/server.properties
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx1024m"
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /opt/kafka/config/custom
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: config
          configMap:
            name: kafka-kraft-config
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: middleware
spec:
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
