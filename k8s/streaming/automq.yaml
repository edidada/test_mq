apiVersion: apps/v1
kind: Deployment
metadata:
  name: automq
  namespace: middleware
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: automq
  template:
    metadata:
      labels:
        app: automq
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker1
      containers:
        - name: automq
          image: docker.1ms.run/automqinc/automq:1.5.5
          command: ["/bin/bash", "-ec"]
          args:
            - |
              /opt/automq/kafka/bin/kafka-server-start.sh \
                /opt/automq/kafka/config/kraft/server.properties \
                --override cluster.id="${CLUSTER_ID}" \
                --override node.id=0 \
                --override controller.quorum.voters=0@automq.middleware.svc.cluster.local:9093 \
                --override controller.quorum.bootstrap.servers=automq.middleware.svc.cluster.local:9093 \
                --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093 \
                --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
                --override controller.listener.names=CONTROLLER \
                --override advertised.listeners=PLAINTEXT://automq.middleware.svc.cluster.local:9092 \
                --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://automq-minio.middleware.svc.cluster.local:9000&pathStyle=true' \
                --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://automq-minio.middleware.svc.cluster.local:9000&pathStyle=true' \
                --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://automq-minio.middleware.svc.cluster.local:9000&pathStyle=true'
          env:
            - name: CLUSTER_ID
              value: 3D4fXN-yS1-vsQ8aJ_q4Mg
            - name: KAFKA_S3_ACCESS_KEY
              value: minioadmin
            - name: KAFKA_S3_SECRET_KEY
              value: minioadmin
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx1024m -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=512m"
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: automq
  namespace: middleware
spec:
  publishNotReadyAddresses: true
  selector:
    app: automq
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
