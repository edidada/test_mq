# C++ Client CI Workflow for macOS
# Tests C++ producer and consumer

name: C++ Client CI (macOS)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cpp/**'
      - '.github/workflows/cmake_macos.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cpp/**'
      - '.github/workflows/cmake_macos.yml'

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/cpp/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      working-directory: ${{github.workspace}}

    - name: Build
      run: cmake --build ${{github.workspace}}/cpp/build --config ${{env.BUILD_TYPE}}
      working-directory: ${{github.workspace}}

    - name: Test Producer
      run: |
        echo "Running C++ producer..."
        ${{github.workspace}}/cpp/build/producer
      working-directory: ${{github.workspace}}

    - name: Test Consumer
      run: |
        echo "Running C++ consumer..."
        ${{github.workspace}}/cpp/build/consumer
      working-directory: ${{github.workspace}}
